name: Release WiredScythe

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron runtime
        run: npx install-electron --no

      - name: Verify
        run: |
          npm run lint
          npm test

      - name: Build Windows installer
        run: npm run release:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}

      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          $escapedVersion = [regex]::Escape($version)
          $notes = [regex]::Match($changelog, "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)")
          if (-not $notes.Success) {
            throw "CHANGELOG.md does not contain release notes for $version."
          }
          $notes.Value.Trim() | Set-Content release/release-notes.md -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wiredscythe-windows-release
          if-no-files-found: error
          retention-days: 2
          path: |
            release/WiredScythe-Setup-x64.exe
            release/WiredScythe-Setup-x64.exe.blockmap
            release/latest.yml
            release/release-notes.md

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release payload
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: wiredscythe-windows-release
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/WiredScythe-Setup-x64.exe \
            release/WiredScythe-Setup-x64.exe.blockmap \
            release/latest.yml \
            --repo "$GITHUB_REPOSITORY" \
            --title "WiredScythe $GITHUB_REF_NAME" \
            --notes-file release/release-notes.md

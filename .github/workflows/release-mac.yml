name: Release Cyber Wire for macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build-and-publish:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron runtime
        run: npx install-electron --no

      - name: Build macOS packages
        # Both architectures are built below; verify the source on macOS first.
        run: npm run release:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify macOS build
        run: |
          npm run lint
          npm test
          npm run test:smoke
          npm run test:official-window
        env:
          CYBERWIRE_TEST_USER_DATA: ${{ runner.temp }}/cyberwire-smoke

      - name: Validate macOS packages
        run: |
          test -f release/CyberWire-arm64.dmg && test -f release/CyberWire-x64.dmg
          node scripts/verify-mac-runtime.mjs

      - name: Wait for the GitHub release created by the Windows workflow
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Windows packaging can take several minutes on a cold runner. Keep
          # the macOS build alive long enough to join the same tagged release.
          for attempt in {1..90}; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "The Windows release was not available in time."
          exit 1

      - name: Upload macOS packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/CyberWire-*.dmg \
            release/CyberWire-*.zip \
            release/CyberWire-*.blockmap \
            release/latest-mac.yml \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
